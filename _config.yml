# Site configuration for dominic-gonschorek.com
#
# This file is *NOT* reloaded automatically when you use `jekyll serve`.
# Restart the server process after changing it.

# Basic site settings
locale                   : "en-US"
site_theme               : "default"
title                    : "Dominic Gonschorek"
title_separator          : "·"
name                     : &name "Dominic Gonschorek"
description              : &description "Dominic Gonschorek is a computational and systems neuroscientist in Tübingen, Germany, who combines large-scale recordings of visual circuits with machine learning and open, reusable datasets."
url                      : https://dominic-gonschorek.com
baseurl                  : ""
repository               : "dgonschorek/dgonschorek.github.io"

# Site author - shown in the sidebar profile (see _includes/author-profile.html).
# Fields left blank are not shown.
author:
  avatar           : "dominic.jpg"
  avatar_alt       : "Portrait of Dominic Gonschorek"
  name             : "Dominic Gonschorek"
  pronouns         :
  # Professional descriptor (what I do) ...
  bio              : "Computational & Systems Neuroscientist"
  # ... and current position (where I do it)
  position         : "Postdoctoral Researcher"
  group            : "Euler Lab"
  group_url        : "https://eulerlab.de/"
  employer         : "University of Tübingen"   # TODO: confirm preferred affiliation (CV lists "University Hospital Tübingen, Centre for Integrative Neuroscience")
  location         : "Tübingen, Germany"
  email            : "dominic.gonschorek@cin.uni-tuebingen.de"
  cv               : "/files/CV_DG.pdf"

  # Academic profiles
  googlescholar    : "https://scholar.google.de/citations?user=1HUhiwoAAAAJ"
  orcid            : "https://orcid.org/0000-0001-5118-9817"
  researchgate     :
  semantic         :

  # Code
  github           : "dgonschorek"

  # Social
  linkedin         : "dominic-gonschorek"
  bluesky          : "dgonschorek.bsky.social"

# Publication categories, in the order they appear on /publications/
publication_category:
  manuscripts:
    title: "Journal articles"
  conferences:
    title: "Conference papers"
  preprints:
    title: "Preprints"

# Site settings
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
comments:
  provider               : false
atom_feed:
  hide                   : true

# SEO and social sharing
og_image                 : "dominic.jpg"   # in /images/
og_image_alt             : "Portrait of Dominic Gonschorek"
twitter:
  username               :
social:
  type                   : Person
  name                   : *name
  links:
    - "https://scholar.google.de/citations?user=1HUhiwoAAAAJ"
    - "https://orcid.org/0000-0001-5118-9817"
    - "https://github.com/dgonschorek"
    - "https://www.linkedin.com/in/dominic-gonschorek"
    - "https://bsky.app/profile/dgonschorek.bsky.social"
google_site_verification :
bing_site_verification   :

# Analytics (none)
analytics:
  provider               : false

# Reading files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .devcontainer
  - .github
  - .idea
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - config
  - docker-compose.yaml
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - local
  - log
  - markdown_generator
  - node_modules
  - package.json
  - package-lock.json
  - README.md
  - tmp
  - vendor
  - _config_docker.yml
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
#  - publications: one page per paper (abstract, links, citation)
#  - talks, teaching: listed in full on /talks/ and /teaching/, no individual pages
collections:
  publications:
    output: true
    permalink: /:collection/:path/
  talks:
    output: false
  teaching:
    output: false

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: publication
      author_profile: true
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Europe/Berlin

# Plugins (all supported by GitHub Pages)
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML compression
compress_html:
  clippings: all
  ignore:
    envs: development
