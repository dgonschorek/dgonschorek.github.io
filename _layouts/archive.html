---
layout: default
---

<div id="main" role="main" tabindex="-1">
  {% include sidebar.html %}

  <div class="archive{% if page.page_class %} {{ page.page_class }}{% endif %}">
    <header class="page__header">
      <h1 class="page__title">{{ page.title }}</h1>
      {% if page.lead %}<p class="page__lead">{{ page.lead | markdownify | remove: "<p>" | remove: "</p>" | strip }}</p>{% endif %}
    </header>
    {{ content }}
  </div>
</div>
